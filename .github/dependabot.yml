# Keeps dependencies and GitHub Actions patched (security updates arrive as PRs).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/prod
    schedule: { interval: monthly }
