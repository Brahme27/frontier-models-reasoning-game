# Local full stack in one command:
#   docker compose up --build            -> http://localhost:8000 (demo bots, no keys needed)
#   cp .env.example .env && edit          -> real models (HF / Mistral / Bedrock) + AI analyst
#   docker compose --profile ollama up    -> also start a local Ollama server (INFERENCE_BACKEND=ollama)
services:
  app:
    build: .
    image: outsmart:local
    ports:
      - "127.0.0.1:8000:8000"   # localhost only
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DEMO_MODE: ${DEMO_MODE:-true}
      STORAGE_BACKEND: sqlite
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-demo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      CORS_ORIGINS: '["http://localhost:8000","http://localhost:5173"]'
    volumes:
      - outsmart-data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434" # Ollama has no auth: never expose it
    volumes:
      - ollama-models:/root/.ollama

volumes:
  outsmart-data:
  ollama-models:
